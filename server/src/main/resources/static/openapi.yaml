components:
  securitySchemes:
    MemberSessionCookie:
      type: apiKey
      in: cookie
      name: MEMBER_SESSION
      description: 회원 전용 HttpOnly 세션 쿠키입니다. 관리자 SESSION과 호환되지 않습니다.
    MemberCsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: 같은 MEMBER_SESSION으로 GET /api/auth/csrf에서 받은 token입니다.
    SessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: |
        CSRF 조회로 익명 세션을 시작하고 로그인 시 인증 세션으로 교체합니다.
        관리자 조회·등록에는 현재 DB에서 ACTIVE·ADMIN인 계정의 세션이 필요합니다.
        브라우저가 쿠키를 관리하므로 Swagger UI의 Authorize 창에 직접 입력하지 않습니다.
    CsrfTokenHeader:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: GET /api/admin/csrf의 token입니다. Swagger UI는 관리자 POST에 자동으로 넣으며 직접 작성한 클라이언트에서는 같은 세션으로 조회·전송합니다.
  parameters:
    ReviewWorkSlug:
      name: slug
      in: path
      required: true
      description: 공개 작품의 slug입니다. 조회되는 공개 작품이 없으면 404입니다.
      schema: {type: string}
      example: sample-book
    ReviewId:
      name: reviewId
      in: path
      required: true
      description: 리뷰 ID의 십진 문자열입니다. 0·선행 0·signed BIGINT 범위 밖은 400입니다.
      schema: {$ref: '#/components/schemas/ReviewIdentifier'}
      example: '101'
    ReviewCommentId:
      name: commentId
      in: path
      required: true
      description: 리뷰 댓글 ID의 십진 문자열입니다. 0·선행 0·signed BIGINT 범위 밖은 400입니다.
      schema: {$ref: '#/components/schemas/ReviewIdentifier'}
      example: '201'
    ReviewPageIndex:
      name: page
      in: query
      description: 1부터 시작하며 생략하면 1입니다. 중복·빈 값·정수가 아닌 값은 400입니다.
      schema: {type: integer, format: int32, minimum: 1, maximum: 2147483647, default: 1}
    ReviewPageSize:
      name: size
      in: query
      description: 페이지당 표시 항목 수입니다. 생략하면 20이며 중복·빈 값·범위 밖은 400입니다.
      schema: {type: integer, format: int32, minimum: 1, maximum: 50, default: 20}
    MagazineSlug:
      name: slug
      in: path
      required: true
      schema: {type: string}
    WorkId:
      name: id
      in: path
      required: true
      description: catalog.works[].id 또는 작품 등록 응답의 숫자 ID입니다. slug와 다릅니다.
      schema: {type: integer, format: int64}
      example: 1
    NotificationId:
      name: notificationId
      in: path
      required: true
      description: 알림 ID의 십진 문자열입니다. 0·선행 0·signed BIGINT 범위 밖은 400입니다.
      schema: {$ref: '#/components/schemas/ReviewIdentifier'}
      example: '1'
    CommunityPostId:
      name: postId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CommunityIdentifier"
    CommunityCommentId:
      name: commentId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CommunityIdentifier"
    CommunityWorkSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    CommunityPage:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
        default: 1
      description: 1부터 시작합니다. 같은 쿼리 이름을 반복하면 400입니다.
    CommunitySize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 50
        default: 20
      description: 페이지 크기는 1~50입니다.
    CommunityBoardType:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum:
          - work
          - topic
          - promotion
        default: work
      description: 조회할 게시판 종류입니다.
    CommunityPostType:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum:
          - work
          - topic
          - promotion
      description: 지정한 종류의 게시글만 조회합니다.
    CommunityBoardId:
      name: boardId
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/CommunityIdentifier"
      description: 특정 공개 게시판으로 제한하며 없거나 공개 범위 밖이면 빈 목록을 반환합니다.
    CommunityHead:
      name: head
      in: query
      required: false
      schema:
        type: string
        enum:
          - IMPRESSION
          - QUESTION
          - THEORY
          - FREE
          - STORY
          - PROMOTION
      description: 지정한 말머리로 제한합니다.
    CommunityBoardQuery:
      name: query
      in: query
      required: false
      schema: {type: string, maxLength: 100, default: ''}
      description: 양끝 Unicode 공백 제거 후 부분 검색합니다. 빈 값이면 전체이며 게시판은 이름, 작품은 제목·저자·출판사를 검색합니다. 같은 쿼리 이름을 반복하면 400입니다.
    CommunityQuery:
      name: query
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
        default: ""
      description: 양끝 공백 제거 후 제목·본문 부분 검색입니다. 본인이 아닌 스포일러 글은 검색에서 제외합니다.
    CommunityMine:
      name: mine
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: 회원 경로의 true는 본인 PUBLISHED·HIDDEN 글만 조회합니다. 공개 경로에서 true이면 401입니다.
    CommunityReveal:
      name: reveal
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: 게시글·이미지 스포일러 열람 확인입니다. 댓글 목록에서 true는 부모와 모든 댓글의 확인입니다. DB·독서 진도는 변경하지 않습니다.
    CommunityRevealPost:
      name: revealPost
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: 댓글 목록의 부모 글만 확인하며 각 댓글의 스포일러는 별도로 가립니다.
    CommunityRevealIds:
      name: revealIds
      in: query
      required: false
      description: 확인한 댓글 ID를 쉼표로 최대 50개 지정합니다. 중복은 같은 ID로 처리하며 다른 댓글은 가립니다.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 50
        items:
          $ref: "#/components/schemas/CommunityIdentifier"
    CommunityImageOwner:
      name: owner
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CommunityIdentifier"
      description: 서버가 반환한 업로드 소유자 식별자입니다.
    CommunityImageName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.png$
  responses:
    WorkFollowError:
      description: 잘못된 요청이거나 공개 작품을 찾을 수 없습니다.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminError'}
    PurchaseProducts:
      description: 공개된 상품·가격·소장 여부의 목록이며 상품 미설정은 빈 배열입니다. Cache-Control은 no-store입니다.
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/PurchaseProduct'}
    PurchaseRecord:
      description: 구매 기록입니다. Cache-Control은 no-store입니다.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PurchaseRecord'}
    PurchaseError:
      description: 입력·상품·가격·소장 권한 또는 서버 처리 오류입니다. code로 오류를 구분합니다.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              code: {type: string, enum: [INVALID_REQUEST, INVALID_TARGET, NOT_FOUND, PRICE_CHANGED, ALREADY_OWNED, REQUEST_CONFLICT, PURCHASE_REQUIRED, UNAUTHENTICATED, UNAVAILABLE]}
              message: {type: string}
    HighlightError:
      description: 입력, 공개 범위, 본문 상태 또는 기록을 확인하십시오.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminError'}
    BookmarkError:
      description: 입력, 공개 범위, 본문 상태 또는 기록을 확인하십시오.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminError'}
    MagazinePageError:
      description: 입력·공개 범위·버전 또는 쪽 공급 오류입니다.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminError'}
    ReadingProgress:
      description: 서버의 현재 읽기 상태입니다.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ReadingProgress'}
    ReadingProgressError:
      description: 입력·공개 범위·본문 또는 저장 충돌 안내입니다.
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: {type: string, enum: [INVALID_POSITION, NOT_FOUND, PROGRESS_CONFLICT, CONTENT_CHANGED, BODY_UNAVAILABLE, PURCHASE_REQUIRED]}
              message: {type: string}
    RecentWorkError:
      description: 작품 식별자 또는 공개 범위 안내입니다.
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: {type: string, enum: [NOT_FOUND, UNAVAILABLE]}
              message: {type: string}
    SignupFieldError:
      description: 입력 또는 문서 버전과 중복 여부를 확인하십시오.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SignupError'
    SignupDisabled:
      description: 시연 가입을 제공하지 않는 환경입니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SignupError'
    CreatedId:
      description: 새 자료를 생성했습니다.
      content:
        application/json:
          schema:
            type: object
            required: [id]
            properties:
              id: {type: integer, format: int64}
          example: {id: 1}
    WorkReviewError:
      description: 입력·본인 반응·공개 범위·작성 권한·중복 활성 리뷰 오류 안내입니다.
      headers:
        Cache-Control: {schema: {type: string, enum: [no-store]}}
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [message]
            properties:
              message: {type: string}
          example: {message: 리뷰 요청 값이 올바르지 않습니다.}
    NotificationError:
      description: 알림 ID 형식 오류 또는 없거나 다른 회원의 알림입니다.
      headers:
        Cache-Control: {schema: {type: string, enum: [no-store]}}
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [message]
            properties:
              message: {type: string}
          example: {message: 알림을 찾을 수 없습니다.}
    WorkReviewPage:
      description: 활성 평점 요약과 삭제 자리표시를 포함한 페이지입니다. 회원 경로는 본인 상태와 myReview를 포함합니다.
      headers:
        Cache-Control: {schema: {type: string, enum: [no-store]}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/WorkReviewPage'}
    WorkReview:
      description: 현재 회원 본인의 활성 리뷰입니다.
      headers:
        Cache-Control: {schema: {type: string, enum: [no-store]}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/WorkReview'}
          example: {id: '101', rating: 4, body: 수정한 리뷰입니다., nickname: 독자 하나, createdAt: '2026-11-21T01:00:00Z', commentCount: 1, likeCount: 2, mine: true, liked: false, reported: false, deleted: false}
    ReviewComment:
      description: 작성 또는 수정한 본인 댓글입니다.
      headers:
        Cache-Control: {schema: {type: string, enum: [no-store]}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ReviewComment'}
          example: {id: '201', body: 리뷰에 공감합니다., nickname: 독자 둘, createdAt: '2026-11-21T02:00:00Z', likeCount: 0, mine: true, liked: false, reported: false}
    ReviewThread:
      description: 부모 리뷰 카드와 작성 시각·댓글 ID 오름차순의 전체 댓글입니다. 삭제 부모도 원문 없는 자리표시로 반환합니다.
      headers:
        Cache-Control: {schema: {type: string, enum: [no-store]}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ReviewThread'}
          example:
            review: {id: '101', rating: null, body: null, nickname: null, createdAt: '2026-11-21T01:00:00Z', commentCount: 1, likeCount: 2, mine: false, liked: false, reported: false, deleted: true}
            items:
              - {id: '201', body: 남아 있는 댓글입니다., nickname: 탈퇴한 회원, createdAt: '2026-11-21T02:00:00Z', likeCount: 0, mine: false, liked: false, reported: false}
    ReviewLikeState:
      description: 변경 후 실제 공감 수와 본인 공감 상태입니다. 등록·해제·반복 요청 모두 200입니다.
      headers:
        Cache-Control: {schema: {type: string, enum: [no-store]}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ReviewLikeState'}
          example: {likeCount: 1, liked: true}
    ReviewReport:
      description: 최초 신고 접수는 201, 중복은 동일한 ID로 200입니다. 최초 사유·상세를 보존하며 신고 원문은 반환하지 않습니다.
      headers:
        Cache-Control: {schema: {type: string, enum: [no-store]}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ReviewReport'}
          example: {id: '301', reported: true}
    BadRequest:
      description: 필수값·자료형·길이·형식 또는 업무 조건이 올바르지 않습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Unauthorized:
      description: 인증에 실패했거나 로그인 세션이 없습니다. 본문이 비어 있을 수 있습니다.
    Forbidden:
      description: CSRF 토큰·쿠키가 일치하지 않거나 현재 활성 ADMIN 권한이 없습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
    NotFound:
      description: 요청한 자료가 없거나 공개 조회할 수 없는 작품입니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Conflict:
      description: 고유 식별자·이메일·닉네임 또는 DB 관계가 충돌합니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminError'
    ServerError:
      description: DB·SDUI 설정 또는 공개 자료의 메타데이터를 처리하지 못했습니다. 간이 데이터로 대체하지 않습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
    CommunityBoard:
      description: 생성한 게시판 또는 이미 존재하는 같은 게시판입니다.
      headers:
        Cache-Control:
          schema: {type: string, enum: [no-store]}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CommunityBoard'}
    CommunityWorkPage:
      description: 공개 작품과 게시판 식별자입니다. 게시판이 없으면 boardId는 null입니다.
      headers:
        Cache-Control:
          schema: {type: string, enum: [no-store]}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CommunityWorkPage'}
    CommunityBoards:
      description: 공개 게시판과 고정 이모티콘입니다.
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommunityBoards"
    CommunityChapters:
      description: 공개 회차 목록이며 본문은 없습니다.
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommunityChapters"
    CommunityPostPage:
      description: 게시 시각·ID 내림차순 게시글 목록입니다.
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommunityPostPage"
    CommunityPost:
      description: 조회·작성·수정한 글입니다.
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommunityPost"
    CommunityCommentPage:
      description: 작성 시각·ID 오름차순 댓글 목록입니다.
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommunityCommentPage"
    CommunityComment:
      description: 작성·수정한 본인 댓글입니다.
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommunityComment"
    CommunityLikeState:
      description: 공감 상태와 실제 개수입니다.
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommunityLikeState"
    CommunityReport:
      description: 최초 사유를 보존한 신고 식별자이며 신고 원문은 반환하지 않습니다.
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommunityReport"
    CommunityImageInput:
      description: 회원 이미지 URL과 실제 치수입니다.
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommunityImageInput"
    CommunityError:
      description: 요청 형식·업무 규칙·공개 범위·저장소 오류의 message입니다.
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommunityError"
    CommunityNoContent:
      description: 처리가 완료되었으며 본문은 없습니다.
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
    CommunityImage:
      description: 권한과 스포일러 확인을 통과한 PNG입니다.
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        image/png:
          schema:
            type: string
            format: binary
  schemas:
    WorkFollowState:
      type: object
      required: [favorite, subscribed]
      properties:
        favorite: {type: boolean}
        subscribed: {type: boolean, description: 웹소설 이외의 작품에서는 항상 false입니다.}
    PurchaseProduct:
      type: object
      additionalProperties: false
      required: [productId, workId, kind, title, imageUrl, chapterId, chapterTitle, price, currency, owned, readable, paymentMode]
      properties:
        productId: {type: string, pattern: '^[1-9][0-9]{0,18}$'}
        workId: {$ref: '#/components/schemas/Slug'}
        kind: {type: string, enum: [book, magazine, novel]}
        title: {type: string, minLength: 1}
        imageUrl: {type: string, minLength: 1}
        chapterId: {type: string, nullable: true}
        chapterTitle: {type: string, nullable: true}
        price: {type: integer, minimum: 0, maximum: 2147483647}
        currency: {type: string, enum: [KRW]}
        owned: {type: boolean}
        readable: {type: boolean}
        paymentMode: {type: string, enum: [DEMO]}
    PurchaseRecord:
      type: object
      additionalProperties: false
      required: [purchaseId, productId, workId, kind, title, imageUrl, purchasedAt, chapterId, chapterTitle, price, currency, paymentMode]
      properties:
        purchaseId: {type: string, pattern: '^[1-9][0-9]{0,18}$'}
        productId: {type: string, pattern: '^[1-9][0-9]{0,18}$'}
        workId: {$ref: '#/components/schemas/Slug'}
        kind: {type: string, enum: [book, magazine, novel]}
        title: {type: string, minLength: 1}
        imageUrl: {type: string, minLength: 1}
        purchasedAt: {type: string, format: date-time}
        chapterId: {type: string, nullable: true}
        chapterTitle: {type: string, nullable: true}
        price: {type: integer, minimum: 0, maximum: 2147483647}
        currency: {type: string, enum: [KRW]}
        paymentMode: {type: string, enum: [DEMO]}
    Highlight:
      type: object
      additionalProperties: false
      required: [id, state, workId, workTitle, kind, chapterTitle, range, color, snippet, createdAt]
      properties:
        id: {type: string, pattern: '^[1-9][0-9]*$'}
        state: {type: string, enum: [available, stale, hidden]}
        workId: {type: string, nullable: true}
        workTitle: {type: string, nullable: true}
        kind: {type: string, nullable: true, enum: [book, novel, magazine, null]}
        chapterTitle: {type: string, nullable: true}
        range:
          type: object
          nullable: true
          required: [chapterId, startOffset, endOffset, unit, contentVersion, contentHash]
          properties:
            chapterId: {type: string}
            startOffset: {type: integer, format: int32, minimum: 0}
            endOffset: {type: integer, format: int32, minimum: 0}
            unit: {type: string, enum: [utf16, page]}
            contentVersion: {type: integer, format: int32, minimum: 1}
            contentHash: {type: string, nullable: true, pattern: '^[a-f0-9]{64}$'}
        color: {type: string, nullable: true, enum: [YELLOW, GREEN, null]}
        snippet: {type: string, nullable: true, maxLength: 500}
        createdAt: {type: string, format: date-time}
    Bookmark:
      type: object
      additionalProperties: false
      required: [id, state, workId, workTitle, kind, chapterTitle, position, snippet, createdAt]
      properties:
        id: {type: string, pattern: '^[1-9][0-9]*$'}
        state: {type: string, enum: [available, stale, hidden]}
        workId: {type: string, nullable: true}
        workTitle: {type: string, nullable: true}
        kind: {type: string, nullable: true, enum: [book, novel, magazine, null]}
        chapterTitle: {type: string, nullable: true}
        position:
          type: object
          nullable: true
          required: [chapterId, offset, unit, contentVersion, contentHash]
          properties:
            chapterId: {type: string}
            offset: {type: integer, format: int32, minimum: 0}
            unit: {type: string, enum: [utf16, page]}
            contentVersion: {type: integer, format: int32, minimum: 1}
            contentHash: {type: string, nullable: true, pattern: '^[a-f0-9]{64}$'}
        snippet: {type: string, nullable: true, maxLength: 200}
        createdAt: {type: string, format: date-time}
    MagazineIssue:
      type: object
      additionalProperties: false
      required: [workId, title, pageCount, articles]
      properties:
        workId: {type: string}
        title: {type: string}
        pageCount: {type: integer, format: int32, minimum: 1}
        articles:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [chapterId, title, startPage, endPage, contentVersion]
            properties:
              chapterId: {type: string, pattern: '^-?[1-9][0-9]*$'}
              title: {type: string}
              startPage: {type: integer, format: int32, minimum: 1}
              endPage: {type: integer, format: int32, minimum: 1}
              contentVersion: {type: integer, format: int32, minimum: 1}
    ReadingProgress:
      type: object
      additionalProperties: false
      required: [workId, kind, state, position, revision, lastReadAt, chapterPercent, workPercent, maxChapterId, libraryStatus, hasNewChapters]
      properties:
        workId: {type: string}
        kind: {type: string, enum: [book, novel, magazine]}
        state: {type: string, enum: [new, saved, stale]}
        position:
          type: object
          nullable: true
          additionalProperties: false
          required: [chapterId, offset, unit, contentVersion, contentHash]
          properties:
            chapterId: {type: string}
            offset: {type: integer, format: int32, minimum: 0}
            unit: {type: string, enum: [utf16, page]}
            contentVersion: {type: integer, format: int32, minimum: 1}
            contentHash: {type: string, nullable: true, pattern: '^[0-9a-f]{64}$'}
        revision: {type: string, nullable: true, pattern: '^[1-9][0-9]*$'}
        lastReadAt: {type: string, nullable: true, format: date-time}
        chapterPercent: {type: number, minimum: 0, maximum: 100, nullable: true}
        workPercent: {type: number, minimum: 0, maximum: 100, nullable: true}
        maxChapterId: {type: string, nullable: true}
        libraryStatus: {type: string, nullable: true, enum: [WANT_TO_READ, READING, COMPLETED, null]}
        hasNewChapters: {type: boolean}
    LibraryWork:
      type: object
      additionalProperties: false
      required: [id, title, author, imageUrl, kind, libraryStatus, lastReadChapterNumber, statistics, hasNextChapter]
      properties:
        id: {type: string, pattern: '^[a-z0-9-]+$', maxLength: 120, description: 상세 조회에 사용하는 작품 slug입니다.}
        title: {type: string, minLength: 1}
        author: {type: string, minLength: 1, description: 저자 ID 순서로 쉼표로 연결한 표시 이름입니다.}
        imageUrl: {type: string, minLength: 1, description: HTTP(S) 주소 또는 API 서버 기준 절대 경로인 표지입니다.}
        kind: {type: string, enum: [book, magazine, novel]}
        libraryStatus: {type: string, enum: [WANT_TO_READ, READING, COMPLETED], description: 읽고 싶은 작품·읽는 중·완독 상태입니다.}
        lastReadChapterNumber: {type: integer, nullable: true, minimum: 1, description: 마지막으로 저장한 현재 공개 회차 번호입니다. 기록이 없거나 회차가 비공개이면 null입니다.}
        statistics:
          type: object
          nullable: true
          additionalProperties: false
          required: [views, recommendations, chapterCount]
          properties:
            views: {type: integer, format: int64, minimum: 0}
            recommendations: {type: integer, format: int64, minimum: 0}
            chapterCount: {type: integer, minimum: 0}
        hasNextChapter: {type: boolean, description: 마지막으로 저장한 공개 회차 다음에 공개된 회차가 있는지 나타냅니다.}
    RecentWork:
      type: object
      additionalProperties: false
      required: [id, title, imageUrl, kind, lastReadAt]
      properties:
        id: {type: string, pattern: '^[a-z0-9-]+$', maxLength: 120, description: 작품 slug입니다.}
        title: {type: string, minLength: 1}
        imageUrl: {type: string, minLength: 1, description: http(s) 주소 또는 서버 기준 /media/... 경로입니다.}
        kind: {type: string, enum: [book, novel, magazine]}
        lastReadAt: {type: string, format: date-time, description: 마지막으로 연 UTC 시각입니다.}
    SignupDocument:
      type: object
      additionalProperties: false
      required: [kind, version, title, body, contentHash, temporary]
      properties:
        kind: {type: string, enum: [TERMS, PRIVACY]}
        version: {type: string, maxLength: 80}
        title: {type: string, maxLength: 255}
        body: {type: string, description: LF를 사용하는 원문 전체입니다.}
        contentHash: {type: string, pattern: '^[0-9a-f]{64}$', description: 본문 UTF-8의 SHA-256입니다.}
        temporary: {type: boolean, enum: [true]}
    SignupInput:
      type: object
      additionalProperties: false
      required: [email, nickname, password, passwordConfirmation, consents]
      properties:
        email: {type: string, description: 공백을 정리한 뒤 형식과 255자 한도를 검사합니다.}
        nickname: {type: string, description: 공백을 정리한 뒤 UTF-16 기준 30자까지 허용합니다.}
        password: {type: string, format: password, minLength: 8, description: 영문과 숫자를 포함하며 UTF-8로 최대 72바이트입니다.}
        passwordConfirmation: {type: string, format: password}
        consents:
          type: array
          minItems: 2
          maxItems: 2
          description: TERMS와 PRIVACY가 하나씩 필요합니다. 버전과 해시는 현재 응답 값과 일치해야 합니다.
          items:
            type: object
            additionalProperties: false
            required: [kind, version, contentHash, agreed]
            properties:
              kind: {type: string, enum: [TERMS, PRIVACY]}
              version: {type: string, maxLength: 80}
              contentHash: {type: string, pattern: '^[0-9a-f]{64}$'}
              agreed: {type: boolean, enum: [true]}
    SignupError:
      type: object
      additionalProperties: false
      required: [message, fieldErrors]
      properties:
        message: {type: string}
        fieldErrors:
          type: object
          description: 입력 오류가 있는 필드만 포함합니다.
          additionalProperties: false
          properties:
            email: {type: string}
            nickname: {type: string}
            password: {type: string}
            passwordConfirmation: {type: string}
            terms: {type: string}
            privacy: {type: string}
            request: {type: string}
    ReaderChapter:
      type: object
      required: [id, title, number]
      properties:
        id: {type: string, minLength: 1}
        title: {type: string, minLength: 1}
        number: {type: integer, minimum: 1}
    NullableReaderChapter:
      type: object
      nullable: true
      required: [id, title, number]
      properties:
        id: {type: string, minLength: 1}
        title: {type: string, minLength: 1}
        number: {type: integer, minimum: 1}
    ChapterText:
      type: object
      required: [workId, workTitle, kind, chapter, contents, currentIndex, previous, next, body, characterCount, contentVersion, contentHash]
      properties:
        workId: {type: string, minLength: 1}
        workTitle: {type: string, minLength: 1}
        kind: {type: string, enum: [book, magazine, novel]}
        chapter: {$ref: '#/components/schemas/ReaderChapter'}
        contents:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ReaderChapter'}
        currentIndex: {type: integer, minimum: 0}
        previous: {$ref: '#/components/schemas/NullableReaderChapter'}
        next: {$ref: '#/components/schemas/NullableReaderChapter'}
        body: {type: string, maxLength: 2097152}
        characterCount: {type: integer, minimum: 0, maximum: 2097152}
        contentVersion: {type: integer, minimum: 1}
        contentHash: {type: string, pattern: '^[a-f0-9]{64}$'}
    HomeKind:
      type: string
      enum: [all, book, magazine, novel]
    WorkKind:
      type: string
      enum: [book, magazine, novel]
    Slug:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '^[a-z0-9-]+$'
      description: URL에 사용하는 공개 작품 식별자입니다.
    Text:
      type: string
      minLength: 1
      description: 공백만 있는 문자열은 허용하지 않습니다.
    ResourceUrl:
      type: string
      minLength: 1
      maxLength: 500
      description: HTTP(S) 주소 또는 API 서버 기준 / 경로입니다. 사용자 정보·역슬래시·제어 문자가 있는 주소는 허용하지 않습니다.
      example: /images/cover.jpg
    Route:
      type: object
      required: [screen]
      properties:
        screen: {type: string, enum: [home, search, library, recent, detail]}
        kind: {$ref: '#/components/schemas/HomeKind'}
        workId:
          type: string
          minLength: 1
          description: detail일 때만 포함하며 해당 화면에서는 필수입니다.
      oneOf:
        - required: [workId]
          additionalProperties: true
          properties:
            screen: {type: string, enum: [detail]}
        - additionalProperties: true
          properties:
            screen: {type: string, enum: [home, search, library, recent]}
          not:
            required: [workId]
    Action:
      type: object
      required: [label, route]
      properties:
        label: {$ref: '#/components/schemas/Text'}
        route: {$ref: '#/components/schemas/Route'}
    SectionBase:
      type: object
      required: [id]
      properties:
        id:
          type: string
          minLength: 1
          description: sections 안에서 고유한 식별자입니다.
        title: {$ref: '#/components/schemas/Text'}
        action: {$ref: '#/components/schemas/Action'}
    BannerItem:
      type: object
      required: [id, title, imageUrl]
      properties:
        id: {$ref: '#/components/schemas/Text'}
        title: {$ref: '#/components/schemas/Text'}
        imageUrl: {$ref: '#/components/schemas/ResourceUrl'}
        description: {$ref: '#/components/schemas/Text'}
        action: {$ref: '#/components/schemas/Action'}
    WorkSearchResult:
      type: object
      additionalProperties: false
      required: [id, title, imageUrl, kind]
      properties:
        id: {$ref: '#/components/schemas/Slug'}
        title: {$ref: '#/components/schemas/Text'}
        imageUrl: {$ref: '#/components/schemas/ResourceUrl'}
        kind: {type: string, enum: [book, magazine, novel]}
    WorkCard:
      type: object
      required: [id, title, imageUrl]
      properties:
        id:
          type: string
          minLength: 1
          description: /works/{slug}에서 사용할 작품 식별자입니다.
        title: {$ref: '#/components/schemas/Text'}
        imageUrl: {$ref: '#/components/schemas/ResourceUrl'}
        subtitle: {$ref: '#/components/schemas/Text'}
    FeaturedCard:
      allOf:
        - $ref: '#/components/schemas/WorkCard'
        - type: object
          required: [label]
          properties:
            label: {$ref: '#/components/schemas/Text'}
            action: {$ref: '#/components/schemas/Action'}
    LinkItem:
      allOf:
        - $ref: '#/components/schemas/Action'
        - type: object
          required: [id]
          properties:
            id: {$ref: '#/components/schemas/Text'}
            icon: {type: string, enum: [bookmark, book, heart, library, search]}
    BannerSection:
      allOf:
        - $ref: '#/components/schemas/SectionBase'
        - type: object
          required: [type, items]
          properties:
            type: {type: string, enum: [bannerCarousel]}
            items: {type: array, items: {$ref: '#/components/schemas/BannerItem'}}
    WorkSection:
      allOf:
        - $ref: '#/components/schemas/SectionBase'
        - type: object
          required: [type, items]
          properties:
            type: {type: string, enum: [workShelf]}
            items: {type: array, items: {$ref: '#/components/schemas/WorkCard'}}
            contentSource:
              type: object
              additionalProperties: false
              required: [type, kind]
              description: 지정하면 items는 빈 배열이며 현재 회원 또는 비회원의 공통 최근 본 목록을 표시합니다.
              properties:
                type: {type: string, enum: [recentWorks]}
                kind: {$ref: '#/components/schemas/HomeKind'}
    FeaturedSection:
      allOf:
        - $ref: '#/components/schemas/SectionBase'
        - type: object
          required: [type, items]
          properties:
            type: {type: string, enum: [featuredWork]}
            items: {type: array, items: {$ref: '#/components/schemas/FeaturedCard'}}
    LinkSection:
      allOf:
        - $ref: '#/components/schemas/SectionBase'
        - type: object
          required: [type, items]
          properties:
            type: {type: string, enum: [linkRow]}
            items: {type: array, items: {$ref: '#/components/schemas/LinkItem'}}
    HomeResponse:
      type: object
      required: [version, sections]
      properties:
        version: {type: integer, enum: [1]}
        sections:
          type: array
          description: 응답 순서로 렌더링합니다. 빈 배열을 허용하며 구역 ID와 각 items 안의 ID는 각각 고유해야 합니다.
          items:
            oneOf:
              - $ref: '#/components/schemas/BannerSection'
              - $ref: '#/components/schemas/WorkSection'
              - $ref: '#/components/schemas/FeaturedSection'
              - $ref: '#/components/schemas/LinkSection'
            discriminator:
              propertyName: type
              mapping:
                bannerCarousel: '#/components/schemas/BannerSection'
                workShelf: '#/components/schemas/WorkSection'
                featuredWork: '#/components/schemas/FeaturedSection'
                linkRow: '#/components/schemas/LinkSection'
    WorkDetail:
      type: object
      required: [id, kind, title, author, imageUrl, description, publisher, publishedAt, category, fileFormat, contents, statistics]
      properties:
        id: {$ref: '#/components/schemas/Slug'}
        kind: {$ref: '#/components/schemas/WorkKind'}
        title: {$ref: '#/components/schemas/Text'}
        author:
          type: string
          description: 복수 저자는 쉼표와 공백으로 연결한 표시 문자열입니다.
        imageUrl: {$ref: '#/components/schemas/ResourceUrl'}
        description: {$ref: '#/components/schemas/Text'}
        publisher: {$ref: '#/components/schemas/Text'}
        publishedAt: {type: string, format: date}
        category:
          type: string
          description: 장르와 카테고리 이름을 중복 제거한 뒤 가운데 점으로 연결한 표시 문자열입니다.
        fileFormat: {$ref: '#/components/schemas/Text'}
        pageCount: {type: integer, format: int32}
        issue: {$ref: '#/components/schemas/Text'}
        publicationCycle: {$ref: '#/components/schemas/Text'}
        contents:
          type: array
          items:
            $ref: '#/components/schemas/Content'
        statistics:
          type: object
          required: [views, recommendations, rating]
          properties:
            views: {type: integer, format: int64}
            recommendations: {type: integer, format: int32}
            rating: {type: number}
    Content:
      type: object
      required: [id, title, publishedAt]
      properties:
        id:
          type: string
          minLength: 1
          description: 회차 내부 DB ID를 문자열로 반환합니다.
        title: {$ref: '#/components/schemas/Text'}
        category: {$ref: '#/components/schemas/Text'}
        pageNumber: {type: integer, format: int32}
        publishedAt:
          type: string
          format: date
          description: 공개 시각을 Asia/Seoul 기준 날짜로 바꾼 값입니다.
        characterCount:
          type: integer
          format: int32
          minimum: 1
          description: DB 값이 0이면 이 필드를 생략합니다.
    CsrfToken:
      type: object
      required: [headerName, parameterName, token]
      properties:
        headerName: {type: string, enum: [X-CSRF-TOKEN]}
        parameterName: {type: string, enum: [_csrf]}
        token: {type: string, minLength: 1}
    AdminSession:
      type: object
      required: [id, email, nickname]
      properties:
        id: {type: integer, format: int64}
        email: {type: string, format: email}
        nickname: {type: string, nullable: true}
    Lookup:
      type: object
      required: [id, name]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
    AdminCatalog:
      type: object
      required: [authors, genres, categories, works]
      properties:
        authors: {type: array, items: {$ref: '#/components/schemas/Lookup'}}
        genres: {type: array, items: {$ref: '#/components/schemas/Lookup'}}
        categories: {type: array, items: {$ref: '#/components/schemas/Lookup'}}
        works:
          type: array
          items:
            type: object
            required: [id, slug, title, kind, publishStatus]
            properties:
              id: {type: integer, format: int64}
              slug: {$ref: '#/components/schemas/Slug'}
              title: {type: string}
              kind: {$ref: '#/components/schemas/WorkKind'}
              publishStatus: {type: string, enum: [DRAFT, PENDING_REVIEW, PUBLISHED, REJECTED, HIDDEN]}
    AccountInput:
      type: object
      required: [email, nickname, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: 공백 없는 이메일이며 도메인에 점이 있어야 합니다. 소문자로 저장합니다.
          example: teammate@example.com
        nickname: {type: string, minLength: 1, maxLength: 30, example: 예시 팀원}
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 72
          description: UTF-16 길이 12자 이상이며 UTF-8로 72바이트 이하여야 합니다. 평문을 저장하지 않습니다.
    AuthorInput:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100, example: 예시 저자}
        bio:
          type: string
          nullable: true
          maxLength: 65535
          description: UTF-8로 65535바이트 이하입니다. 생략·null·공백은 null로 저장합니다.
        field: {type: string, nullable: true, maxLength: 100}
    GenreInput:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 50, example: 판타지}
        displayOrder: {type: integer, format: int32, default: 0}
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 50, example: 장편}
        description: {type: string, nullable: true, maxLength: 255}
        displayOrder: {type: integer, format: int32, default: 0}
    RelationIds:
      type: array
      uniqueItems: true
      items: {type: integer, format: int64, minimum: 1}
    ChapterInput:
      type: object
      required: [chapterNo, title]
      properties:
        chapterNo: {type: integer, format: int32, minimum: 1}
        title: {type: string, minLength: 1, maxLength: 200}
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            null·생략이면 비공개이며 미래 시각이면 예약 공개됩니다. UTC 또는 오프셋이 있는 ISO 8601 시각을 사용합니다.
            DB 범위는 1970-01-01T00:00:01Z부터 2038-01-19T03:14:07Z까지입니다.
        characterCount: {type: integer, format: int32, minimum: 0, default: 0}
        summary:
          type: string
          nullable: true
          maxLength: 65535
          description: UTF-8로 65535바이트 이하입니다.
        category: {type: string, nullable: true, maxLength: 50}
        pageNumber:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          description: 매거진은 필수이며 회차 순서대로 증가하고 전체 쪽수 이하여야 합니다.
        contentUrl:
          type: string
          nullable: true
          maxLength: 500
          description: 공개 시각을 입력하면 필수입니다. HTTP(S) 주소 또는 API 서버 기준 / 경로를 사용합니다.
