          pattern: ^-?[1-9][0-9]{0,18}$
          maxLength: 20
          description: 기존 회차 범위 호환용입니다. 새 작성 화면은 null을 보내며 지정할 때는 연결 작품의 공개 회차여야 하고 hasSpoiler=false와 함께 지정할 수 없습니다.
          nullable: true
        hasSpoiler:
          type: boolean
          description: 회차 지정 없이 스포일러를 표시합니다. 구입력에서 생략하면 spoilerChapterId 지정 여부를 사용합니다.
        images:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/CommunityImageInput"
        stickerIds:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/CommunityIdentifier"
    CommunityCommentInput:
      type: object
      additionalProperties: false
      required:
        - body
        - spoilerChapterId
        - stickerIds
      description: 일반 이미지는 첨부하지 않습니다. hasSpoiler로 회차 없이 스포일러를 표시합니다. 기존 spoilerChapterId는 부모 글에 연결된 작품의 공개 회차이며 hasSpoiler=false와 함께 지정할 수 없습니다. 구입력에서 hasSpoiler 생략 시 회차 지정 여부를 사용합니다.
      properties:
        body:
          type: string
          maxLength: 2000
          nullable: true
          description: null·빈 문자열·공백만 있으면 이모티콘을 하나 이상 지정해야 합니다.
        hasSpoiler:
          type: boolean
          description: 회차 없이 스포일러를 표시하며 생략한 구입력만 회차 지정 여부로 해석합니다.
        spoilerChapterId:
          type: string
          pattern: ^-?[1-9][0-9]{0,18}$
          maxLength: 20
          description: 0·선행 0이 없는 signed BIGINT 문자열입니다. -9223372036854775808~9223372036854775807이며 JSON 숫자는 허용하지 않습니다.
          nullable: true
        stickerIds:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/CommunityIdentifier"
    CommunityLikeState:
      type: object
      additionalProperties: false
      required:
        - liked
        - likeCount
      properties:
        liked:
          type: boolean
        likeCount:
          type: integer
          format: int64
          minimum: 0
    CommunityReportInput:
      type: object
      additionalProperties: false
      required:
        - reason
        - detail
      properties:
        reason:
          type: string
          enum:
            - SPAM
            - ABUSE
            - INAPPROPRIATE
            - SPOILER
            - OTHER
        detail:
          type: string
          maxLength: 500
          nullable: true
          description: 양끝 공백 제거 후 선택 상세입니다. 빈 문자열·공백은 null입니다.
    CommunityReport:
      type: object
      additionalProperties: false
      required:
        - id
        - reported
      properties:
        id:
          $ref: "#/components/schemas/CommunityIdentifier"
        reported:
          type: boolean
          enum:
            - true
    CommunityImageUploadInput:
      type: object
      additionalProperties: false
      required:
        - base64
        - mimeType
      description: 클라이언트는 선택한 PNG·JPEG·WebP를 JPEG 또는 PNG로 변환합니다. 서버는 실제 형식·치수를 검사하고 메타데이터를 제거한 PNG로 다시 인코딩합니다. 결과 PNG도 2MiB 이하여야 합니다.
      properties:
        base64:
          type: string
          format: byte
          minLength: 4
          maxLength: 2796204
          description: "data: 접두사 없는 Base64입니다. 디코딩 후 2MiB 이하이며 실제 JPEG·PNG이고 가로·세로 각각 1~1024px여야 합니다."
        mimeType:
          type: string
          enum:
            - image/jpeg
            - image/png
    CommunityError:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
    CommunityPublishInput:
      type: object
      additionalProperties: false
      required:
        - boardId
        - workId
        - head
        - title
        - body
        - spoilerChapterId
        - images
        - stickerIds
      description: 게시·수정에는 양끝 공백 제거 후 비어 있지 않은 제목·본문이 필요합니다. 게시한 글의 게시판과 연결 작품은 바꿀 수 없습니다. 새 클라이언트는 hasSpoiler를 포함한 모든 필드를 전송하며 구입력에서 hasSpoiler 생략 시에만 회차 지정 여부를 사용합니다. 추가 필드는 허용하지 않습니다.
      properties:
        boardId:
          $ref: "#/components/schemas/CommunityIdentifier"
        workId:
          type: string
          pattern: ^[a-z0-9-]{1,100}$
          maxLength: 100
          nullable: true
          description: WORK는 게시판 작품 또는 null, PROMOTION은 공개 작품 필수, TOPIC은 선택입니다.
        head:
          type: string
          enum:
            - IMPRESSION
            - QUESTION
            - THEORY
            - FREE
            - STORY
            - PROMOTION
        title:
          type: string
          maxLength: 100
          description: 양끝 Unicode 공백 제거 후 1~100 코드 포인트입니다.
          minLength: 1
        body:
          type: string
          maxLength: 25000
          description: 양끝 Unicode 공백 제거 후 비어 있지 않은 저장값입니다. 표시 텍스트는 10,000 코드 포인트 이하, 이미지 표식을 포함한 저장값은 25,000 이하입니다. CommunityPostInput과 같은 등록 첨부 표식 제외 규칙을 적용하며 내부 줄바꿈은 유지합니다.
          minLength: 1
        spoilerChapterId:
          type: string
          pattern: ^-?[1-9][0-9]{0,18}$
          maxLength: 20
          description: 기존 회차 범위 호환용입니다. 새 작성 화면은 null을 보내며 지정할 때는 연결 작품의 공개 회차여야 하고 hasSpoiler=false와 함께 지정할 수 없습니다.
          nullable: true
        hasSpoiler:
          type: boolean
          description: 회차 지정 없이 스포일러를 표시합니다. 구입력에서 생략하면 spoilerChapterId 지정 여부를 사용합니다.
        images:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/CommunityImageInput"
        stickerIds:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/CommunityIdentifier"
    CommunityPost:
