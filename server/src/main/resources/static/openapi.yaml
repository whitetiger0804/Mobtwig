  /works/{slug}/reviews:
    get:
      tags: [리뷰]
      operationId: listWorkReviews
      summary: 공개 작품의 최신 리뷰와 전체 활성 리뷰의 평점 요약을 조회합니다.
      description: |
        활성 리뷰와 댓글이 남은 삭제 리뷰 자리표시를 작성 시각·리뷰 ID 내림차순으로 반환합니다.
        totalItems와 hasNext는 자리표시를 포함한 표시 항목 기준이며 reviewCount·평균·분포는 활성 리뷰만 집계합니다.
        활성 리뷰가 없으면 averageRating은 null입니다. 댓글이 남아 있으면 items가 비어 있지 않을 수 있습니다.
        공개 경로의 mine·liked·reported는 항상 false이고 myReview는 null입니다. 인증 쿠키를 보내도 동일합니다.
        조회수·읽기 위치를 변경하지 않으며 요약과 목록은 같은 스냅샷에서 조회합니다.
      parameters:
        - $ref: '#/components/parameters/ReviewWorkSlug'
        - $ref: '#/components/parameters/ReviewPageIndex'
        - $ref: '#/components/parameters/ReviewPageSize'
      responses:
        '200':
          description: 작품 전체의 평점 요약과 요청 페이지의 리뷰입니다.
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkReviewPage'}
              example:
                averageRating: 4.5
                reviewCount: 2
                ratingDistribution: {'1': 0, '2': 0, '3': 0, '4': 1, '5': 1}
                items:
                  - {id: '101', rating: 5, body: 다시 읽고 싶은 작품입니다., nickname: 독자 하나, createdAt: '2026-11-21T01:00:00Z', commentCount: 1, likeCount: 2, mine: false, liked: false, reported: false, deleted: false}
                  - {id: '100', rating: 4, body: null, nickname: 탈퇴한 회원, createdAt: '2026-11-20T01:00:00Z', commentCount: 0, likeCount: 0, mine: false, liked: false, reported: false, deleted: false}
                hasNext: false
                totalItems: 2
                myReview: null
        '400': {$ref: '#/components/responses/WorkReviewError'}
        '404': {$ref: '#/components/responses/WorkReviewError'}
  /api/members/works/{slug}/reviews:
    get:
      tags: [리뷰]
      operationId: listMemberWorkReviews
      summary: 리뷰 페이지와 페이지 밖의 본인 활성 리뷰를 함께 조회합니다.
      description: |
        공개 목록과 같은 표시·집계·정렬 규칙을 적용하며 현재 회원의 mine·liked·reported를 포함합니다.
        myReview는 페이지와 관계없이 회원 본인의 활성 리뷰이며 없으면 null입니다.
        삭제 자리표시의 rating·body·nickname은 null이고 mine·liked·reported는 모두 false입니다.
        GET에는 CSRF가 필요하지 않으며 조회수·읽기 위치를 변경하지 않습니다.
      security: [{MemberSessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/ReviewWorkSlug'
        - $ref: '#/components/parameters/ReviewPageIndex'
        - $ref: '#/components/parameters/ReviewPageSize'
      responses:
        '200': {$ref: '#/components/responses/WorkReviewPage'}
        '400': {$ref: '#/components/responses/WorkReviewError'}
        '401': {description: 활성 회원 세션이 필요합니다. 본문은 없습니다.}
        '404': {$ref: '#/components/responses/WorkReviewError'}
    post:
      tags: [리뷰]
      operationId: createWorkReview
      summary: 공개 작품에 로그인한 회원 본인의 리뷰를 등록합니다.
      description: 작품별 활성 리뷰는 회원당 하나입니다. 본문이 생략되거나 null·공백이면 별점만 저장합니다. 작품 행을 먼저 잠그고 등록과 평균·건수 재집계를 함께 커밋합니다. 조회수·읽기 위치를 변경하지 않습니다.
      security: [{MemberSessionCookie: [], MemberCsrfToken: []}]
      parameters:
        - $ref: '#/components/parameters/ReviewWorkSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkReviewInput'}
            example: {rating: 5, body: 다시 읽고 싶은 작품입니다.}
      responses:
        '201':
          description: 등록된 리뷰입니다.
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkReview'}
        '400': {$ref: '#/components/responses/WorkReviewError'}
        '401': {description: 활성 회원 세션이 필요합니다. 본문은 없습니다.}
        '403': {description: 해당 회원 세션의 CSRF 토큰이 필요합니다. 본문은 없습니다.}
        '404': {$ref: '#/components/responses/WorkReviewError'}
        '409': {$ref: '#/components/responses/WorkReviewError'}
  /api/members/reviews/{reviewId}:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    put:
      tags: [리뷰]
      operationId: updateOwnReview
      summary: 본인의 활성 리뷰를 수정합니다.
      description: rating은 필수입니다. body 생략·null·공백은 별점만 남기는 수정입니다. 작성 시각과 ID는 유지하며 작품 잠금 안에서 평점 캐시를 재집계합니다. 없는 리뷰·타인 리뷰·삭제 리뷰·비공개 작품은 404입니다.
      security: [{MemberSessionCookie: [], MemberCsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkReviewInput'}
            example: {rating: 4, body: 수정한 리뷰입니다.}
      responses:
        '200': {$ref: '#/components/responses/WorkReview'}
        '400': {$ref: '#/components/responses/WorkReviewError'}
        '401': {description: 활성 회원 세션이 필요합니다. 본문은 없습니다.}
        '403': {description: 회원 CSRF 검증에 실패했습니다. 본문은 없습니다.}
        '404': {$ref: '#/components/responses/WorkReviewError'}
    delete:
      tags: [리뷰]
      operationId: deleteOwnReview
      summary: 본인의 활성 리뷰를 삭제 처리합니다.
      description: |
        deleted_at을 설정하고 활성 평점 요약을 재집계합니다. 마지막 평점 삭제 후 DB average_rating은 0.00이며 조회 응답 averageRating은 null입니다.
        남은 댓글은 유지하고 삭제 후 재작성은 새 리뷰 ID를 발급합니다. 없는 리뷰·타인 리뷰·삭제 리뷰·비공개 작품은 404입니다.
      security: [{MemberSessionCookie: [], MemberCsrfToken: []}]
      responses:
        '204': {description: 리뷰를 삭제 처리했습니다. 본문은 없습니다., headers: {Cache-Control: {schema: {type: string, enum: [no-store]}}}}
        '400': {$ref: '#/components/responses/WorkReviewError'}
        '401': {description: 활성 회원 세션이 필요합니다. 본문은 없습니다.}
        '403': {description: 회원 CSRF 검증에 실패했습니다. 본문은 없습니다.}
        '404': {$ref: '#/components/responses/WorkReviewError'}
