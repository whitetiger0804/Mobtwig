      security:
        - SessionCookie: []
          CsrfTokenHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkInput'
      responses:
        '201':
          description: 내부 DB ID와 공개 조회에 사용할 slug입니다.
