        '404': {$ref: '#/components/responses/WorkFollowError'}
    delete:
      operationId: unsubscribeFromWork
      summary: 웹소설 구독을 해제합니다.
      security: [{MemberSessionCookie: [], MemberCsrfToken: []}]
      responses:
        '200':
          description: 현재 회원의 작품 상태입니다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkFollowState'}
        '400': {$ref: '#/components/responses/WorkFollowError'}
        '401': {description: 활성 회원 세션 필요}
        '403': {description: 회원 CSRF 검증 실패}
        '404': {$ref: '#/components/responses/WorkFollowError'}
  /api/members/favorites:
    get:
      operationId: listWorkFavorites
      summary: 회원 본인이 찜한 공개 작품의 목록을 최신순으로 조회합니다.
      security: [{MemberSessionCookie: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, format: int32, minimum: 1, default: 1}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200':
          description: 찜 목록입니다. 작품이 없으면 빈 배열을 반환합니다.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, hasNext]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, title, imageUrl, kind]
                      properties:
                        id: {type: string, description: 공개 작품 slug}
                        title: {type: string}
                        imageUrl: {type: string}
                        kind: {type: string, enum: [book, magazine, novel]}
                  page: {type: integer, minimum: 1}
                  hasNext: {type: boolean}
        '400': {$ref: '#/components/responses/WorkFollowError'}
        '401': {description: 활성 회원 세션 필요}
  /api/members/library:
    get:
      tags: [회원 인증]
      operationId: listLibrary
      summary: 회원 본인의 서재를 작품 분류별로 조회합니다.
      description: |
        요청 형식은 GET /api/members/library?kind={kind}입니다. kind는 생략하면 all이며 한 번만 지정합니다.
        숨기지 않은 공개 작품만 서재에 담은 시각 내림차순, 같은 시각이면 서재 ID 내림차순으로 모두 반환합니다. 개수 제한은 없습니다.
        기존 읽기 위치 저장이 서재를 자동 등록하고 READING 또는 COMPLETED로 갱신합니다. 목록 조회는 기록을 변경하지 않습니다.
        WANT_TO_READ는 DB에 해당 상태로 등록된 작품입니다. 별도 담기·즐겨찾기·숨기기 변경 API는 이번 조회 범위에 포함하지 않습니다.
        lastReadChapterNumber는 본인이 마지막으로 저장한 현재 공개 회차 번호이며 유효한 기록이 없으면 null입니다.
        author는 저자 ID 순서의 표시 이름입니다. statistics는 웹소설의 조회·추천·공개 회차 수이며 다른 종류는 null입니다.
        hasNextChapter는 저장한 공개 회차 뒤에 현재 공개된 회차가 있는지 나타냅니다.
        공개 작품의 필수 정보가 잘못되면 오류를 반환하며 항목을 조용히 누락하지 않습니다.
      security: [{MemberSessionCookie: []}]
      parameters:
        - name: kind
          in: query
          required: false
          description: 조회할 작품 종류입니다. 생략하면 전체 서재입니다.
          schema: {type: string, enum: [all, book, magazine, novel], default: all}
      responses:
        '200':
          description: 서재 목록입니다. 일치하는 작품이 없으면 빈 배열입니다.
          headers:
            Cache-Control:
              description: 회원 목록을 캐시하지 않습니다.
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/LibraryWork'}
              example:
                - id: sample-book
                  title: 예시 도서
                  author: 예시 저자
                  imageUrl: /media/covers/sample-book.png
                  kind: book
                  libraryStatus: READING
                  lastReadChapterNumber: 2
                  statistics: null
                  hasNextChapter: true
        '400': {description: kind가 중복되었거나 빈 값 또는 미지원 값입니다.}
        '401': {description: 활성 회원 세션 필요}
        '500': {description: 공개 작품의 필수 정보가 계약에 맞지 않습니다.}
  /api/members/recent-works:
    get:
      tags: [회원 인증]
      operationId: listRecentWorks
      summary: 회원 본인이 최근 본 공개 작품을 최근 본 순서로 최대 20개 확인합니다.
      description: 비공개 작품은 제외하며 기록 자체는 삭제하지 않습니다. 공개 작품의 필수 정보가 잘못되면 오류를 반환하며 항목을 조용히 누락하지 않습니다. 조회수와 읽기 기록을 변경하지 않습니다.
      security: [{MemberSessionCookie: []}]
      responses:
        '200':
          description: 최근 본 순서의 작품 목록입니다. 기록이 없으면 빈 배열입니다.
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items: {$ref: '#/components/schemas/RecentWork'}
        '401': {description: 활성 회원 세션 필요}
        '500': {description: 공개 작품의 필수 정보가 계약에 맞지 않습니다.}
  /api/members/recent-works/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: {type: string}
    post:
      tags: [회원 인증]
      operationId: recordRecentWork
      summary: 공개 작품을 열었음을 기록하고 최근 본 시각을 갱신합니다.
      description: 요청 본문이 없습니다. 같은 작품을 다시 열면 행을 추가하지 않고 시각만 갱신합니다. 시각은 초 단위입니다.
      security: [{MemberSessionCookie: [], MemberCsrfToken: []}]
      responses:
        '204': {description: 기록했으며 본문은 없습니다.}
        '401': {description: 활성 회원 세션 필요}
        '403': {description: 회원 CSRF 검증 실패}
        '404': {$ref: '#/components/responses/RecentWorkError'}
  /api/members/notifications:
    get:
      tags: [알림]
      operationId: listNotifications
      summary: 회원 본인의 최신 알림 50개와 전체 안 읽은 개수를 조회합니다.
      description: |
        생성 시각 내림차순, 같은 시각이면 알림 ID 내림차순으로 최대 50개를 반환합니다. 페이지 처리는 없습니다.
        unreadCount는 50개 제한과 무관한 본인의 전체 안 읽은 알림 수입니다. 알림이 없으면 unreadCount 0과 빈 배열입니다.
        조회는 읽음 상태를 변경하지 않습니다.
      security: [{MemberSessionCookie: []}]
      responses:
        '200':
          description: 최신 알림 목록입니다.
          headers:
            Cache-Control:
              description: 회원 알림을 캐시하지 않습니다.
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationList'}
              example:
                unreadCount: 1
                items:
                  - id: '1'
                    type: notice
                    title: 모북이에 오신 것을 환영합니다
                    message: 읽고 싶은 작품을 찾아 서재에 담아 보세요.
                    createdAt: '2026-01-02T03:04:05Z'
                    readAt: null
        '401': {description: 활성 회원 세션이 필요합니다. 본문은 없습니다.}
  /api/members/notifications/{notificationId}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    patch:
      tags: [알림]
      operationId: markNotificationRead
      summary: 본인 알림을 읽음으로 표시합니다.
      description: |
        요청 본문이 없습니다. 안 읽은 알림이면 현재 시각을 readAt으로 기록합니다.
        이미 읽은 알림도 readAt을 바꾸지 않고 204를 반환합니다.
        없는 알림과 다른 회원의 알림은 구분하지 않고 404입니다.
      security: [{MemberSessionCookie: [], MemberCsrfToken: []}]
      responses:
        '204':
          description: 읽음으로 표시했으며 본문은 없습니다.
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
        '400': {$ref: '#/components/responses/NotificationError'}
        '401': {description: 활성 회원 세션이 필요합니다. 본문은 없습니다.}
        '403': {description: 회원 CSRF 검증에 실패했습니다. 본문은 없습니다.}
        '404': {$ref: '#/components/responses/NotificationError'}
  /api/auth/terms:
    get:
      tags: [회원 인증]
      operationId: getSignupTerms
      summary: 가입 화면에 표시할 현재 시연 문서 두 종류를 조회합니다.
      responses:
        '200':
          description: 이용약관과 개인정보 수집·이용 동의 원문입니다.
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items:
                      $ref: '#/components/schemas/SignupDocument'
        '503':
          $ref: '#/components/responses/SignupDisabled'
  /api/auth/signup:
    post:
      tags: [회원 인증]
      operationId: signupMember
      summary: 현재 시연 문서에 동의한 일반 회원 계정을 생성합니다.
      description: 회원, 읽기 설정, 동의한 약관의 버전과 동의 시각을 함께 저장합니다. 성공 후 기존 익명 회원 세션을 유지합니다.
      security: [{MemberSessionCookie: [], MemberCsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupInput'
      responses:
        '201':
          description: 새 회원의 표시 정보입니다.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, email, nickname]
                properties:
                  id: {type: string, pattern: '^[1-9][0-9]*$'}
                  email: {type: string, maxLength: 255}
                  nickname: {type: string, maxLength: 30}
        '400':
          $ref: '#/components/responses/SignupFieldError'
        '403': {description: 회원 CSRF 검증 실패}
        '409':
          $ref: '#/components/responses/SignupFieldError'
        '503':
          $ref: '#/components/responses/SignupDisabled'
  /api/auth/login:
    post:
      tags: [회원 인증]
      operationId: loginMember
      summary: 이메일과 비밀번호로 회원 세션을 시작합니다.
      security: [{MemberSessionCookie: [], MemberCsrfToken: []}]
      description: 같은 MEMBER_SESSION의 CSRF 토큰이 필요하며 성공 시 세션 ID를 교체합니다. 비활성 계정·없는 이메일·틀린 비밀번호는 모두 401입니다.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, maxLength: 255}
                password: {type: string, format: password}
      responses:
        '204': {description: 로그인 성공. 본문 없이 HttpOnly MEMBER_SESSION 쿠키를 발급합니다.}
        '401': {description: 인증 실패}
        '403': {description: CSRF 검증 실패}
  /api/auth/logout:
    post:
      tags: [회원 인증]
      operationId: logoutMember
      summary: 현재 회원 세션만 종료합니다.
      security: [{MemberSessionCookie: [], MemberCsrfToken: []}]
      description: 같은 MEMBER_SESSION의 CSRF 토큰이 필요합니다. 관리자 SESSION은 유지합니다.
      responses:
        '204': {description: 세션 무효화 및 회원 쿠키 만료. 본문 없음}
        '403': {description: CSRF 검증 실패}
  /api/auth/session:
    get:
      tags: [회원 인증]
      operationId: getMemberSession
      summary: 현재 활성 회원 본인의 표시 정보를 조회합니다.
      security: [{MemberSessionCookie: []}]
      description: 7일 미사용 세션·비활성 계정은 401입니다. 활성 회원의 요청에서 서버 세션과 쿠키의 유효기간을 함께 갱신합니다. 응답은 no-store이며 요청의 id 파라미터로 조회 대상을 바꿀 수 없습니다.
      responses:
        '200':
          description: 활성 회원 본인 정보
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, email, nickname, createdAt]
                properties:
                  id: {type: string, pattern: '^-?[1-9][0-9]*$'}
                  email: {type: string, maxLength: 255}
                  nickname: {type: string, maxLength: 30}
                  createdAt: {type: string, format: date-time}
        '401': {description: 세션 없음·만료·비활성 회원·인증 영역 불일치}
  /api/auth/csrf:
    get:
      tags: [회원 인증]
      operationId: getMemberCsrf
      summary: 회원 인증 영역의 CSRF 토큰을 조회합니다.
      description: |
        MEMBER_SESSION 쿠키를 유지한 채 변경 요청에 X-CSRF-TOKEN을 보냅니다.
        관리자 SESSION과 구분하며 잘못된 인증 영역의 쿠키는 401입니다.
        HttpOnly 쿠키는 JS 저장소에 복사하지 않습니다.
      responses:
        '200':
          description: 현재 회원 세션의 토큰입니다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CsrfToken'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/admin/csrf:
    get:
      tags: [관리자 인증]
      operationId: getAdminCsrf
      summary: 현재 세션의 CSRF 토큰을 받습니다.
      description: |
        로그인 전에도 호출할 수 있으며 익명 세션 쿠키를 발급할 수 있습니다.
        이후 POST에도 동일한 쿠키를 전송하고 반환한 headerName 이름으로 token을 보냅니다.
        로그인·로그아웃 후에는 토큰을 다시 받습니다. 토큰과 쿠키를 문서나 저장소에 기록하지 않습니다.
      responses:
        '200':
          description: 현재 세션에 연결한 토큰입니다.
          headers:
            Set-Cookie:
              description: 세션을 새로 만들면 SESSION 쿠키를 발급합니다. 운영 HTTPS에서는 Secure를 사용합니다.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /api/admin/login:
    post:
      tags: [관리자 인증]
      operationId: loginAdmin
      summary: 이메일과 비밀번호로 로그인합니다.
      description: |
        username에 이메일을 넣고 JSON 대신 폼으로 전송합니다.
        같은 쿠키로 CSRF 토큰을 먼저 받아야 합니다. 로그인 성공 시 세션 ID와 CSRF 토큰이 변경됩니다.
        활성 USER 계정도 인증 자체는 성공할 수 있으므로 /api/admin/session의 200으로 ADMIN 권한을 확인합니다.
      security:
        - SessionCookie: []
          CsrfTokenHeader: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  description: 계정의 이메일입니다.
                  example: admin@example.com
                password:
                  type: string
                  format: password
                  writeOnly: true
                  description: 기존 계정의 비밀번호입니다.
      responses:
        '204':
          description: 로그인에 성공했습니다. JSON 본문을 읽지 말고 변경된 쿠키를 보관합니다.
          headers:
            Set-Cookie:
              description: 로그인 전 세션을 교체한 SESSION 쿠키입니다.
              schema: {type: string}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/logout:
    post:
      tags: [관리자 인증]
      operationId: logoutAdmin
      summary: 현재 세션을 종료합니다.
      description: 현재 쿠키와 CSRF 토큰을 전송합니다. 로그아웃 후 기존 세션으로 관리자 API에 접근할 수 없습니다.
      security:
        - SessionCookie: []
          CsrfTokenHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object}
            example: {}
      responses:
        '204':
          description: 세션을 종료했습니다. 응답 본문은 없습니다.
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/session:
    get:
      tags: [관리자 인증]
      operationId: getAdminSession
      summary: 활성 ADMIN 로그인 상태를 확인합니다.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: 비밀번호와 해시가 없는 현재 관리자 정보입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/catalog:
    get:
      tags: [관리자 등록]
      operationId: getAdminCatalog
      summary: 등록에 사용할 관계 ID와 작품 목록을 조회합니다.
      description: authorIds·genreIds·categoryIds와 작품 경로의 id는 이 응답에서 선택합니다. 작품에는 비공개 상태도 포함합니다.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: 저자·분류·작품의 현재 DB 목록입니다. 자료가 없으면 빈 배열입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/accounts:
    post:
      tags: [관리자 등록]
      operationId: createAdminAccount
      summary: 팀원 ADMIN 계정을 생성합니다.
