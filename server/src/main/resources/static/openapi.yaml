openapi: 3.0.3
info:
  title: Mobtwig HTTP API
  version: 0.0.1-SNAPSHOT
  description: |
    현재 구현한 홈 SDUI·작품 검색·상세·리뷰·댓글·커뮤니티·알림·회원 인증·관리자 등록 API의 계약입니다.
    이 명세를 포함한 커밋이 배포된 서버에서 사용합니다.
    공개 조회에는 로그인이 필요하지 않습니다. 관리자 API는 SESSION 쿠키와 활성 ADMIN 권한을 사용합니다.
    회원 인증 API는 별도의 MEMBER_SESSION 쿠키를 사용합니다.
    POST·PUT·PATCH·DELETE 요청은 같은 인증 영역·세션의 csrf 경로에서 받은 X-CSRF-TOKEN 헤더가 필요합니다.
    로그인은 application/x-www-form-urlencoded이며 성공 시 본문 없는 204를 반환합니다.
    이 서버의 Swagger UI는 회원·관리자 변경 요청 전에 해당 영역의 CSRF 토큰을 자동으로 조회합니다.
    로그인 요청을 실행한 뒤 관리자 API를 호출하고, 사용을 마치면 로그아웃 요청을 실행하십시오.
    Authorize 창에 SESSION 쿠키를 직접 입력하지 않습니다. 브라우저가 로그인 응답의 쿠키를 관리합니다.
    Try it out으로 등록한 자료는 접속한 서버의 실제 DB에 저장합니다.
servers:
  - url: /
    description: 이 명세를 제공하는 서버입니다.
tags:
  - name: 공개 조회
    description: 앱의 홈과 작품 검색·상세를 조회합니다.
  - name: 회원 인증
    description: 관리자와 분리한 회원 쿠키 및 CSRF를 사용합니다.
  - name: 구매
    description: 상품 구매 기록과 소장 권한을 관리합니다.
  - name: 리뷰
    description: 공개 리뷰·평점과 댓글, 본인 작성물 관리, 공감·신고 접수를 제공합니다. 관리자 심사·자동 숨김·이미지 첨부·추가 정렬은 포함하지 않습니다.
  - name: 커뮤니티
    description: 작품별·주제별·홍보 게시판, 게시글·댓글, 이미지·이모티콘·초안과 게시글 공감·신고를 제공합니다.
  - name: 알림
    description: 회원 본인의 최신 알림 조회와 읽음 처리를 제공합니다. 현재 생성하는 알림은 가입 환영 알림뿐입니다.
  - name: 관리자 인증
    description: 세션과 CSRF 토큰으로 로그인 상태를 관리합니다.
  - name: 관리자 등록
    description: 활성 ADMIN 계정이 실제 DB에 자료를 등록합니다.
  - name: 상태 확인
    description: API와 DB의 준비 상태를 확인합니다.
security: []
paths:
  /s/works/{slug}:
    get:
      tags: [공개 조회]
      operationId: showSharedWorkLanding
      summary: 공유 작품의 모바일 웹 안내 HTML을 제공합니다.
      description: |
        로그인 없이 고정 HTML을 반환합니다. 브라우저는 /share/의 JavaScript·CSS·로고를 읽고
        기존 GET /works/{slug}를 쿠키 없이 한 번 호출하여 작품 정보를 표시합니다.
        상세 API의 기존 조회수 집계가 적용되며 자동 폴링은 하지 않습니다.
        유효한 slug이면 작품이 없어도 HTML은 200이며 상세 API의 404를 웹에서 안내합니다.
        사용자 query의 제목·문장·이동 주소는 사용하지 않습니다.
        앱 열기는 mobtwig://works/{slug}이며 설치 주소가 준비될 때까지 설치 준비 중으로 표시합니다.
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z0-9-]{1,120}$', maxLength: 120}
      responses:
        '200':
          description: 공유 작품 안내 HTML입니다.
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
            Referrer-Policy: {schema: {type: string, enum: [no-referrer]}}
            Content-Security-Policy:
              description: 같은 origin의 스크립트·스타일·API와 HTTP(S) 표지만 허용하며 인라인 스크립트와 프레임 삽입은 차단합니다.
              schema: {type: string}
          content:
            text/html:
              schema: {type: string}
        '404': {description: slug 형식 또는 공유 경로가 올바르지 않습니다.}
  /share/{file}:
    get:
      tags: [공개 조회]
      operationId: getSharedWorkAsset
      summary: 공유 웹 안내의 JavaScript·CSS·로고를 제공합니다.
      description: 공개 정적 자원입니다. 사용자 입력이나 인증 쿠키를 콘텐츠에 반영하지 않습니다.
      parameters:
        - name: file
          in: path
          required: true
          schema: {type: string, enum: [app.js, work.js, style.css, header.png]}
      responses:
        '200':
          description: 요청한 공유 웹 정적 파일입니다.
          content:
            text/javascript:
              schema: {type: string}
            text/css:
              schema: {type: string}
            image/png:
              schema: {type: string, format: binary}
        '404': {description: 요청한 정적 파일이 없습니다.}
  /works:
    get:
      tags: [공개 조회]
      operationId: searchWorks
      summary: 공개 작품의 제목·저자·출판사를 부분 검색합니다.
      description: |
        요청 형식은 GET /works?query={query}&kind={kind}입니다. 중괄호에는 검색어와 선택한 작품 종류를 넣습니다.
        query를 정확히 한 번 지정합니다. 앞뒤 공백을 제거한 검색어는 1자 이상 200자 이하이어야 합니다.
        제목·저자 이름·출판사 중 하나에 검색어가 포함되면 반환합니다. %, _, !는 문자 그대로 검색합니다.
        kind는 생략하면 all이며 지정할 때는 한 번만 보냅니다. 빈 값·중복·지원하지 않는 값은 400입니다.
        genre는 선택적인 장르 이름입니다. 앞뒤 공백을 제거하고 검색어·종류와 AND로 결합하며 반복 지정하면 첫 번째 값을 사용합니다.
        장르 생략은 모든 장르를 포함합니다. 이름이 일치하는 장르 연결이 없으면 빈 배열이며 카테고리 이름으로 대체하지 않습니다.
        빈 값이나 긴 값도 검색하며 일치하는 장르가 없으면 빈 배열입니다. 장르 이름의 %, _, !는 와일드카드가 아닙니다.
        결과는 출간일·DB ID 내림차순의 전체 일치 목록이며 공동 저자나 복수 장르 때문에 작품이 중복되지 않습니다.
        조회수·최근 본 기록·읽기 위치를 변경하지 않습니다. 공개 자료의 필수 정보 오류는 500입니다.
      parameters:
        - name: query
          in: query
          required: true
          description: 검색할 작품 제목·저자 이름·출판사의 일부입니다.
          schema: {type: string, minLength: 1}
        - name: kind
          in: query
          required: false
          description: 선택한 작품 종류이며 생략하면 전체 작품을 검색합니다.
          schema:
            type: string
            enum: [all, book, magazine, novel]
            default: all
        - name: genre
          in: query
          required: false
          description: 이름이 일치하는 장르를 가진 작품으로 제한하며 생략하면 모든 장르를 포함합니다.
          schema: {type: string}
      responses:
        '200':
          description: 검색 결과이며 일치하는 공개 작품이 없으면 빈 배열입니다.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/WorkSearchResult'}
              examples:
                found:
                  summary: 검색 결과가 있는 경우입니다.
                  value:
                    - {id: sample-book, title: 과학을 읽는 시간, imageUrl: /images/cover.jpg, kind: book}
                empty:
                  summary: 일치하는 공개 작품이 없는 경우입니다.
                  value: []
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/ServerError'}
  /sdui/home:
    get:
      tags: [공개 조회]
      operationId: getHome
      summary: 분류별 홈 SDUI를 조회합니다.
      description: |
        kind를 정확히 한 번 지정합니다. 구역과 항목의 순서는 응답 배열의 순서입니다.
        일반 작품 목록은 출간일·DB ID 내림차순이며 추천 목록은 찜 수·평점·출간일·DB ID 내림차순입니다.
        제목·표지 주소·추천 카드의 저자와 분류는 DB에서 읽으며 공개 작품이 없으면 빈 items를 반환합니다.
        dataSource는 서버 내부 설정으로 응답에 포함하지 않습니다.
        workShelf의 contentSource가 recentWorks이면 items는 빈 배열이며 클라이언트의 공통 최근 본 저장소가 내용을 제공합니다.
      parameters:
        - name: kind
          in: query
          required: true
          description: 조회할 홈 분류입니다. 중복 지정과 쉼표로 묶은 복수 값은 허용하지 않습니다.
          schema:
            $ref: '#/components/schemas/HomeKind'
          example: all
      responses:
        '200':
          description: 클라이언트가 지원하는 버전 1의 홈입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeResponse'
              example:
                version: 1
                sections:
                  - id: welcome
                    type: bannerCarousel
                    items:
                      - id: welcome-book
                        title: 새로운 이야기를 만나십시오.
                        imageUrl: /images/banner.jpg
                        action:
                          label: 도서를 확인합니다.
                          route: {screen: home, kind: book}
                  - id: latest
                    type: workShelf
                    title: 새로 공개한 작품
                    items:
                      - {id: sample-book, title: 예시 도서, imageUrl: /images/cover.jpg}
                  - id: featured
                    type: featuredWork
                    items:
                      - {id: sample-book, title: 예시 도서, imageUrl: /images/cover.jpg, label: 오늘의 도서}
                  - id: shortcuts
                    type: linkRow
                    items:
                      - id: search
                        label: 검색합니다.
                        icon: search
                        route: {screen: search, kind: all}
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /works/{slug}/magazine:
    get:
      tags: [공개 조회]
      operationId: getMagazineIssue
      summary: 공개 매거진 호와 기사 쪽 범위를 확인합니다.
      description: 비공개 기사는 목록에서 빠지며 앞 기사의 끝 쪽 계산에는 반영합니다. 진도와 조회수를 변경하지 않습니다.
      parameters:
        - $ref: '#/components/parameters/MagazineSlug'
      responses:
        '200':
          description: 쪽 순서의 공개 기사 목록입니다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MagazineIssue'}
        '400': {$ref: '#/components/responses/MagazinePageError'}
        '404': {$ref: '#/components/responses/MagazinePageError'}
        '503': {$ref: '#/components/responses/MagazinePageError'}
  /works/{slug}/magazine/pages/{pageNumber}:
    get:
      tags: [공개 조회]
      operationId: getMagazinePage
      summary: 공개 기사와 버전에 속하는 PNG 한 쪽을 반환합니다.
      parameters:
        - $ref: '#/components/parameters/MagazineSlug'
        - name: pageNumber
          in: path
          required: true
          schema: {type: integer, format: int32, minimum: 1}
        - name: contentVersion
          in: query
          required: true
          schema: {type: integer, format: int32, minimum: 1}
      responses:
        '200':
          description: 캐시하지 않는 호 기준 PNG 한 쪽입니다.
          content:
            image/png:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/MagazinePageError'}
        '401': {$ref: '#/components/responses/PurchaseError'}
        '404': {$ref: '#/components/responses/MagazinePageError'}
        '409': {$ref: '#/components/responses/MagazinePageError'}
        '503': {$ref: '#/components/responses/MagazinePageError'}
  /works/{slug}/chapters/{chapterId}:
    get:
      tags: [공개 조회]
      operationId: getChapterText
      summary: 공개 회차의 텍스트 본문과 목차를 조회합니다.
      description: |
        PUBLISHED 작품의 published_at이 현재 이하인 같은 작품 회차만 제공합니다.
        contents는 공개 회차 번호 순서이고 currentIndex는 0부터 시작합니다.
        previous/next는 공개 목차의 이웃이며 경계에서는 명시적 null입니다.
        지정 비공개 폴더의 /content/...txt만 읽고 외부 HTTP 요청은 하지 않습니다.
        UTF-8 BOM 하나를 제거하고 CRLF/CR을 LF로 바꾸며 나머지 공백과 Unicode는 보존합니다.
        characterCount는 body의 UTF-16 길이입니다. contentVersion은 DB 정수 버전,
        contentHash는 body UTF-8의 SHA-256 소문자 hex입니다.
        서버는 처음 제공한 회차·버전의 해시를 고정합니다. 같은 버전에서 원문이 바뀌면 409입니다.
        HTML/EPUB/외부 contentUrl 저장값은 보존하지만 이 API에서는 415입니다.
        원본 상한은 2097152 바이트이며 파일 부재/손상/초과는 503입니다.
        조회수·독서기록·진도를 변경하지 않습니다. 빈 body도 정상입니다.
        유료 상품으로 설정한 작품·회차는 이 공개 경로에서 401입니다. 소장 회원은 /api/members/works/{slug}/chapters/{chapterId}를 사용합니다.
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
        - name: chapterId
          in: path
          required: true
          description: 공개 목차에서 받은 불투명 ID입니다. 숫자로 증감하지 않습니다.
          schema: {type: string, pattern: '^[A-Za-z0-9_-]+$', maxLength: 80}
      responses:
        '200':
          description: 정규화 텍스트와 같은 시각의 공개 목차입니다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChapterText'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': {$ref: '#/components/responses/PurchaseError'}
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 현재 회차 버전에 고정한 원문과 파일이 다릅니다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminError'}
        '415':
          description: 지원하지 않는 본문 공급 형식입니다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminError'}
        '503':
          description: 본문 파일을 안전하게 제공할 수 없습니다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminError'}
        '500':
          description: 내부 정보를 포함하지 않는 본문 처리 오류입니다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminError'}
  /works/{slug}:
    get:
      tags: [공개 조회]
      operationId: getWorkDetail
      summary: 공개 작품의 상세와 목차를 조회합니다.
      description: |
        slug는 홈 카드의 id입니다. DRAFT·HIDDEN 등 비공개 작품은 404입니다.
        contents에는 현재 시각까지 공개한 회차만 회차 번호 순서로 포함합니다.
        회차 공개일은 Asia/Seoul 기준 날짜로 반환합니다.
        정상 조회 후 누적·일별 조회 수를 증가시키므로 반복 호출에도 집계가 발생합니다.
        응답 통계는 증가 직전에 읽은 값입니다. 본문 파일과 contentUrl은 이 응답에 포함하지 않습니다.
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
          example: sample-book
      responses:
        '200':
          description: null인 선택 필드는 생략한 작품 상세입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkDetail'
              example:
                id: sample-book
                kind: book
                title: 예시 도서
                author: 예시 저자
                imageUrl: /images/cover.jpg
                description: 문서의 예시 작품입니다.
                publisher: 예시 출판사
                publishedAt: '2026-01-01'
                category: 판타지 · 장편
                fileFormat: EPUB
                pageCount: 120
                contents:
                  - {id: '1', title: 첫 번째 장, publishedAt: '2026-01-01', characterCount: 1500}
                statistics: {views: 0, recommendations: 0, rating: 0.00}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/members/highlights:
    get:
      operationId: listHighlights
      summary: 회원 본인의 하이라이트를 조회합니다.
      description: 비공개 또는 현재 미소장 유료 기록은 hidden으로 반환하며 ID·저장 시각 외의 내용과 메타데이터는 null입니다.
      security: [{MemberSessionCookie: []}]
      parameters:
        - {name: workId, in: query, schema: {type: string}}
        - {name: chapterId, in: query, description: 단독으로도 지정할 수 있습니다., schema: {type: string, pattern: '^-?[1-9][0-9]{0,18}$'}}
        - {name: page, in: query, schema: {type: integer, format: int32, minimum: 1, default: 1}}
      responses:
        '200':
          description: 최신순 기록 최대 30건입니다.
          content:
            application/json:
              schema:
                type: object
