spring:
  application:
    name: mobtwig-server
  config:
    import: "optional:file:./.env[.properties][encoding=utf-8]"
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      "[hibernate.jdbc.time_zone]": UTC

mobtwig:
  reader:
    content-root: ${CONTENT_ROOT:./content}
  admin:
    bootstrap-enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
  sdui:
    home-path: ${SDUI_HOME_PATH:./sdui/home.json}

server:
  address: 0.0.0.0
  port: ${SERVER_PORT}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
