name: mobtwig-shared

services:
  mysql:
    image: mysql:8.4.11@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME을 배포 환경 파일에 설정하십시오.}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME을 배포 환경 파일에 설정하십시오.}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 배포 환경 파일에 설정하십시오.}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD를 배포 환경 파일에 설정하십시오.}
      MYSQL_ROOT_HOST: localhost
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --batch --skip-column-names --execute="SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    image: ${API_IMAGE:?API_IMAGE를 배포할 이미지의 다이제스트 주소로 설정하십시오.}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?DB_NAME을 배포 환경 파일에 설정하십시오.}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME을 배포 환경 파일에 설정하십시오.}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 배포 환경 파일에 설정하십시오.}
      SERVER_PORT: "8080"
      TZ: UTC
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

volumes:
  mysql_data:
